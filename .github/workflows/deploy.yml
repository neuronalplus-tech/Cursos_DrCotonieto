name: Deploy a Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El LINT sí bloquea, pero SOLO por errores (no por avisos de estilo).
      #
      # Historia: se puso bloqueante del todo, un aviso de hooks congeló el
      # deploy y se desactivó por completo. El problema era bloquear por
      # AVISOS. Con `--max-warnings 999` el deploy solo se detiene ante un
      # ERROR real (p. ej. una variable inexistente como la que dejó
      # muerto "Volver a intentar" en los exámenes durante semanas, porque
      # el lint lo detectaba pero no bloqueaba). Los avisos siguen saliendo
      # en el log sin frenar nada.
      - name: Lint (errores, no avisos)
        run: npm run lint -- --max-warnings 999

      # El check de imports/columnas sigue informativo: da falsos positivos
      # (avisa de imports "sin usar" que sí se usan en JSX) y no debe frenar.
      - name: Comprobar imports de componentes
        run: npm run check
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Deploy a Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
